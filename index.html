<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>Учёт панелей ЛДСП</title>
<style>
  :root {
    --bg-body: #f5f5f5; --bg-card: #ffffff; --bg-input: #fafafa; --bg-th: #f0f0f0;
    --bg-tab: #f0f0f0; --bg-tab-active: #ffffff; --bg-btn-icon: #eef2ff;
    --text-main: #222222; --text-label: #555555; --text-th: #555555;
    --border-color: #d0d0d0; --shadow: rgba(0,0,0,.07); --ac-bg-hover: #eef2ff;
  }
  body.dark {
    --bg-body: #121212; --bg-card: #1e1e1e; --bg-input: #2a2a2a; --bg-th: #2a2a2a;
    --bg-tab: #2a2a2a; --bg-tab-active: #333333; --bg-btn-icon: #333333;
    --text-main: #e0e0e0; --text-label: #aaaaaa; --text-th: #bbbbbb;
    --border-color: #444444; --shadow: rgba(0,0,0,.3); --ac-bg-hover: #333333;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg-body); color: var(--text-main);
    padding: 16px; padding-bottom: calc(20px + env(safe-area-inset-bottom));
    max-width: 1100px; margin: 0 auto; transition: background 0.3s, color 0.3s;
  }
  .logo-bar {
    background: var(--bg-card); border-radius: 12px; padding: 16px; margin: 0 0 14px;
    box-shadow: 0 2px 10px var(--shadow); display: flex; align-items: center; justify-content: center; position: relative;
  }
  .logo-bar img { height: 56px; width: auto; max-width: 220px; object-fit: contain; display: block; }
  .theme-btn {
    position: absolute; top: 50%; transform: translateY(-50%); background: transparent; border: 0; padding: 8px;
    cursor: pointer; color: var(--text-label); border-radius: 50%; display: flex; align-items: center; justify-content: center;
  }
  .theme-btn:hover { background: var(--bg-tab); color: var(--text-main); }
  .theme-btn.left { left: 8px; } .theme-btn.right { right: 8px; }
  .theme-btn svg { width: 24px; height: 24px; fill: currentColor; }
  h1 { font-size: 22px; margin: 0 0 14px; }
  .list-bar {
    display: flex; gap: 8px; align-items: center; background: var(--bg-card); border-radius: 12px; padding: 10px;
    box-shadow: 0 2px 10px var(--shadow); margin-bottom: 14px; flex-wrap: wrap;
  }
  .list-bar select {
    flex: 1; min-width: 180px; padding: 12px 14px; font-size: 16px; font-weight: 500;
    border: 1.5px solid var(--border-color); border-radius: 10px; background: var(--bg-input); color: var(--text-main);
  }
  .list-bar select:focus { outline: none; border-color: #4f46e5; }
  .icon-btn {
    width: 46px; height: 46px; padding: 0; font-size: 18px; background: var(--bg-btn-icon); color: #4f46e5;
    border-radius: 10px; flex-shrink: 0; border: 0; cursor: pointer;
  }
  .icon-btn.danger { background: #fee2e2; color: #dc2626; }
  body.dark .icon-btn.danger { background: #4a1c1c; color: #f87171; }
  .card { background: var(--bg-card); border-radius: 14px; padding: 20px; box-shadow: 0 2px 10px var(--shadow); margin-bottom: 16px; }
  label { display: block; font-size: 15px; margin: 0 0 6px; color: var(--text-label); font-weight: 500; }
  input[type="text"], input[type="number"], input:not([type]) {
    width: 100%; padding: 14px 16px; font-size: 17px; border: 1.5px solid var(--border-color); border-radius: 10px; background: var(--bg-input); color: var(--text-main);
  }
  input:focus { outline: none; border-color: #4f46e5; background: var(--bg-card); }
  .form-grid { display: grid; grid-template-columns: 1fr 2fr 1fr 1fr 1fr 1fr; gap: 14px; align-items: end; }
  @media (max-width: 900px) { .form-grid { grid-template-columns: 1fr 1fr; } .form-grid .full { grid-column: 1 / -1; } }
  button { padding: 16px; font-size: 17px; border: 0; border-radius: 10px; background: #4f46e5; color: #fff; cursor: pointer; font-weight: 500; }
  button:active { transform: scale(.98); filter: brightness(.92); }
  button.sec { background: #16a34a; } button.imp { background: #0ea5e9; } button.shr { background: #9333ea; }
  button.qrs { background: #ea580c; } button.del { background: #dc2626; }
  .add-btn { margin-top: 18px; width: 100%; font-size: 18px; padding: 18px; }
  .scan-btn { margin-top: 10px; width: 100%; font-size: 18px; padding: 18px; }
  .table-toolbar { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .table-toolbar input[type="text"] { flex: 1; min-width: 180px; padding: 12px 14px; font-size: 16px; border: 1.5px solid var(--border-color); border-radius: 10px; background: var(--bg-input); color: var(--text-main); }
  .table-toolbar select { padding: 12px 14px; font-size: 15px; border: 1.5px solid var(--border-color); border-radius: 10px; background: var(--bg-input); color: var(--text-main); min-width: 170px; }
  .view-tabs { display: flex; margin-bottom: 12px; background: var(--bg-tab); border-radius: 10px; padding: 4px; gap: 4px; }
  .view-tabs .tab { flex: 1; padding: 10px; background: transparent; color: var(--text-label); border-radius: 8px; font-size: 15px; font-weight: 500; border: 0; margin: 0; }
  .view-tabs .tab.active { background: var(--bg-tab-active); color: #4f46e5; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid var(--border-color); }
  th { background: var(--bg-th); font-weight: 600; font-size: 13px; text-transform: uppercase; color: var(--text-th); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; } th.num { text-align: right; }
  tbody tr { cursor: pointer; } tbody tr:hover { background: var(--bg-tab); }
  .x { background: #fee2e2; color: #dc2626; border: 0; width: 40px; height: 40px; border-radius: 8px; font-size: 20px; cursor: pointer; padding: 0; }
  body.dark .x { background: #4a1c1c; color: #f87171; }
  .empty { color: var(--text-label); text-align: center; padding: 40px 20px; font-size: 16px; }
  .sum { font-size: 15px; color: var(--text-main); margin: 14px 0 0; padding: 12px; background: var(--bg-tab); border-radius: 8px; }
  .sum b { color: #4f46e5; }
  .actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 16px; }
  .ac-wrap { position: relative; }
  .ac-list { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.15); max-height: 280px; overflow-y: auto; z-index: 50; display: none; padding: 4px; }
  .ac-list.open { display: block; }
  .ac-item { padding: 14px; font-size: 16px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; color: var(--text-main); }
  .ac-item:hover, .ac-item.active { background: var(--ac-bg-hover); }
  .ac-item .ico { color: #4f46e5; font-size: 14px; flex-shrink: 0; }
  .ac-item mark { background: #fde68a; color: #222; padding: 0 1px; border-radius: 2px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--bg-card); border-radius: 14px; padding: 24px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  .modal h2 { margin: 0 0 16px; font-size: 20px; }
  .modal .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 4px; }
  .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
  .btn-cancel { background: var(--bg-tab); color: var(--text-main); }
  #qrReader { width: 100%; border-radius: 10px; overflow: hidden; }
  #qrReader video { width: 100% !important; height: auto !important; }
  .loader { text-align: center; padding: 20px; font-size: 16px; color: #4f46e5; font-weight: bold; }
  @media (max-width: 500px) { .logo-bar img { height: 44px; } h1 { font-size: 18px; } .theme-btn svg { width: 20px; height: 20px; } .form-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="logo-bar">
  <button class="theme-btn left" onclick="setTheme('dark')" title="Темная тема">
    <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
  </button>
  <img id="appLogo" src="parma.svg" alt="Parma">
  <button class="theme-btn right" onclick="setTheme('light')" title="Светлая тема">
    <svg viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
  </button>
</div>

<h1>📐 Учёт панелей ЛДСП</h1>

<div class="list-bar">
  <select id="listSelect" onchange="switchList(this.value)"></select>
  <button class="icon-btn" onclick="newList()" title="Новый список">➕</button>
  <button class="icon-btn" onclick="renameList()" title="Переименовать">✏️</button>
  <button class="icon-btn danger" onclick="deleteList()" title="Удалить список">🗑</button>
</div>

<div class="card">
  <div class="form-grid">
    <div>
      <label>Чертёж (ID)</label>
      <input id="sku" type="text" placeholder="izdeg..." autocomplete="off">
    </div>
    <div>
      <label>Материал (Наименование)</label>
      <div class="ac-wrap">
        <input id="name" type="text" placeholder="ЛДСП..." autocomplete="off">
        <div class="ac-list" id="acList"></div>
      </div>
    </div>
    <div><label>Ширина, мм</label><input id="width" type="number" inputmode="numeric" placeholder="600"></div>
    <div><label>Длина, мм</label><input id="length" type="number" inputmode="numeric" placeholder="1200"></div>
    <div><label>Толщина, мм</label><input id="thick" type="number" inputmode="numeric" placeholder="16"></div>
    <div><label>Кол-во</label><input id="qty" type="number" inputmode="numeric" min="1" placeholder="1"></div>
  </div>
  <button class="add-btn" onclick="addItem()">➕ Добавить панель</button>
  <button class="scan-btn qrs" onclick="openScanner()">📷 Сканировать QR</button>
</div>

<div class="card">
  <div class="table-toolbar">
    <input type="text" id="searchBox" placeholder="🔍 Поиск по материалу или ID" autocomplete="off">
    <select id="sortSelect">
      <option value="default">Без сортировки</option>
      <option value="name">Материал ↑</option>
      <option value="name-desc">Материал ↓</option>
      <option value="area">Площадь ↑</option>
      <option value="area-desc">Площадь ↓</option>
    </select>
  </div>
  <div class="view-tabs">
    <button class="tab active" id="tabDetail" onclick="setView('detail')">Детально</button>
    <button class="tab" id="tabSummary" onclick="setView('summary')">Сводка</button>
  </div>
  <div id="empty" class="empty">Пока пусто. Добавьте первую панель.</div>
  <div id="viewDetail">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Чертёж</th><th>Материал</th><th class="num">Ш</th><th class="num">Д</th><th class="num">Т</th><th class="num">Кол</th><th class="num">Площадь</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
  <div id="viewSummary" style="display:none">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Материал</th><th class="num">Позиций</th><th class="num">Панелей, шт</th><th class="num">Площадь, м²</th></tr></thead>
        <tbody id="tbodySummary"></tbody>
      </table>
    </div>
  </div>
  <div class="sum" id="sum" style="display:none"></div>
  <div class="actions">
    <button class="sec" onclick="exportExcel()">📥 Скачать Excel</button>
    <button class="shr" onclick="shareExcel()">📤 Поделиться</button>
    <button class="imp" onclick="document.getElementById('fileInput').click()">📂 Импорт Excel</button>
    <button class="del" onclick="clearAll()">🗑 Очистить</button>
  </div>
  <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none" onchange="handleFile(event)">
</div>

<!-- Модалка редактирования -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h2>✏️ Редактировать панель</h2>
    <label>Чертёж (ID)</label>
    <input type="text" id="editSku" autocomplete="off">
    <label>Материал (Наименование)</label>
    <input type="text" id="editName" autocomplete="off">
    <div class="row-3">
      <div><label>Ширина, мм</label><input type="number" id="editWidth"></div>
      <div><label>Длина, мм</label><input type="number" id="editLength"></div>
      <div><label>Толщина, мм</label><input type="number" id="editThick"></div>
    </div>
    <label>Количество</label>
    <input type="number" id="editQty" min="1">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeEdit()">Отмена</button>
      <button onclick="saveEdit()">Сохранить</button>
    </div>
  </div>
</div>

<!-- Модалка сканера -->
<div class="modal-overlay" id="scanModal">
  <div class="modal" style="text-align:center;max-width:520px">
    <h2>📷 Сканирование</h2>
    <div id="qrReader"></div>
    <div id="ocrLoader" class="loader" style="display:none;">⏳ Распознавание текста с фото...</div>
    <p style="color:var(--text-label);font-size:14px;margin-top:12px">Наведите камеру на QR или бирку</p>
    <button style="width:100%;padding:14px;margin-top:16px;background:#0ea5e9" onclick="document.getElementById('qrFileInput').click()">
      📁 Загрузить фото
    </button>
    <button class="btn-cancel" style="width:100%;padding:14px;margin-top:10px" onclick="closeScanner()">Отмена</button>
    <input type="file" id="qrFileInput" accept="image/*" style="display:none" onchange="handleQrFile(event)">
  </div>
</div>

<!-- Модалка подтверждения -->
<div class="modal-overlay" id="scanConfirmModal">
  <div class="modal">
    <h2>📷 Найдено</h2>
    <p id="scanRaw" style="font-size:13px;color:var(--text-label);background:var(--bg-input);padding:10px;border-radius:8px;word-break:break-all;margin-bottom:16px"></p>
    <label>Чертёж (ID)</label>
    <input type="text" id="scanSku">
    <label>Материал (Наименование)</label>
    <input type="text" id="scanName" placeholder="ЛДСП...">
    <div class="row-3">
      <div><label>Ширина</label><input type="number" id="scanWidth"></div>
      <div><label>Длина</label><input type="number" id="scanLength"></div>
      <div><label>Толщина</label><input type="number" id="scanThick"></div>
    </div>
    <label>Количество</label>
    <input type="number" id="scanQty" min="1" value="1">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="cancelScanConfirm()">Отмена</button>
      <button onclick="confirmScanAdd()">Добавить</button>
    </div>
    <button style="width:100%;margin-top:10px;background:#0891b2" onclick="cancelScanConfirm();setTimeout(openScanner,200)">📷 Сканировать ещё</button>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
/* ==================== ТЕМА ==================== */
function setTheme(theme) {
  const logo = document.getElementById('appLogo');
  if (theme === 'dark') {
    document.body.classList.add('dark'); localStorage.setItem('ldsp_theme', 'dark');
    if (logo) logo.src = 'parma_dark.svg'; document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#1e1e1e');
  } else {
    document.body.classList.remove('dark'); localStorage.setItem('ldsp_theme', 'light');
    if (logo) logo.src = 'parma.svg'; document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#4f46e5');
  }
}
(function initTheme() { if (localStorage.getItem('ldsp_theme') === 'dark') setTheme('dark'); })();

/* ==================== ХРАНИЛИЩЕ ==================== */
const STORAGE_KEY = 'ldsp_lists_v3'; // версия изменилась из-за смены логики
const OLD_KEY = 'ldsp_lists_v2';
const $ = id => document.getElementById(id);
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

function migrateItems(arr) {
  if (!Array.isArray(arr)) return [];
  return arr.map(i => ({
    id: i.id || uid(), sku: String(i.sku || '').trim(), name: String(i.name || '').trim(),
    width: Number(i.width) || 0, length: Number(i.length) || 0, thick: Number(i.thick) || 0,
    qty: Number.isFinite(+i.qty) && +i.qty > 0 ? Math.floor(+i.qty) : 1
  }));
}
function loadState() {
  try {
    let raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(OLD_KEY);
    if (raw) { const s = JSON.parse(raw); if (s && Array.isArray(s.lists) && s.lists.length) { s.lists.forEach(l => { l.items = migrateItems(l.items); }); return s; } }
  } catch (e) {}
  const list = { id: uid(), name: 'Список 1', items: [] };
  return { lists: [list], currentListId: list.id };
}
let state = loadState();
let searchQuery = '', sortKey = 'default', viewMode = 'detail', editingId = null;
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function currentList() { return state.lists.find(l => l.id === state.currentListId) || state.lists[0]; }
function getItems() { return currentList().items; }
function setItems(items) { currentList().items = items; saveState(); }

/* ==================== СЛИЯНИЕ ==================== */
function panelsEqual(a, b) {
  if (a.sku && b.sku) return a.sku.trim().toLowerCase() === b.sku.trim().toLowerCase() && +a.width === +b.width && +a.length === +b.length && +a.thick === +b.thick;
  return String(a.name).trim().toLowerCase() === String(b.name).trim().toLowerCase() && +a.width === +b.width && +a.length === +b.length && +a.thick === +b.thick;
}
function addOrMergeItem(item) {
  const items = getItems(); const idx = items.findIndex(x => panelsEqual(x, item));
  if (idx !== -1) { items[idx].qty = (items[idx].qty || 1) + (item.qty || 1); setItems(items); return 'merged'; }
  items.push(item); setItems(items); return 'added';
}
function showMergeToast(name) {
  const old = $('mergeToast'); if (old) old.remove();
  const t = document.createElement('div'); t.id = 'mergeToast';
  t.style.cssText = `position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #16a34a; color: #fff; padding: 12px 20px; border-radius: 10px; box-shadow: 0 4px 12px rgba(0,0,0,.25); z-index: 9999; font-size: 15px; font-weight: 500; max-width: 90vw; text-align: center;`;
  t.textContent = `➕ Прибавлено к «${name || 'ID ' + item.sku}»`; document.body.appendChild(t); setTimeout(() => t.remove(), 1800);
}

/* ==================== СПИСКИ ==================== */
function renderListSelect() {
  const sel = $('listSelect'); sel.innerHTML = '';
  state.lists.forEach(l => { const opt = document.createElement('option'); opt.value = l.id; opt.textContent = `${l.name} (${l.items.length})`; if (l.id === state.currentListId) opt.selected = true; sel.appendChild(opt); });
}
function switchList(id) { state.currentListId = id; saveState(); closeAc(); searchQuery = ''; $('searchBox').value = ''; render(); }
function newList() { const name = prompt('Название нового списка:', `Список ${state.lists.length + 1}`); if (name === null) return; const list = { id: uid(), name: name.trim() || 'Новый', items: [] }; state.lists.push(list); state.currentListId = list.id; saveState(); render(); }
function renameList() { const l = currentList(); const name = prompt('Новое название:', l.name); if (name && name.trim()) { l.name = name.trim(); saveState(); renderListSelect(); } }
function deleteList() { if (state.lists.length <= 1) return alert('Нельзя удалить единственный список'); if (!confirm(`Удалить список "${currentList().name}"?`)) return; state.lists = state.lists.filter(x => x.id !== state.currentListId); state.currentListId = state.lists[0].id; saveState(); render(); }

/* ==================== АВТОДОПОЛНЕНИЕ ==================== */
const nameInput = $('name'), acList = $('acList'); let acMatches = [], acActive = -1;
function uniqueNames() { const set = new Set(getItems().map(i => i.name.trim())); return [...set].filter(Boolean).sort((a, b) => a.localeCompare(b, 'ru')); }
function openAc(query) {
  const all = uniqueNames(); const q = query.trim().toLowerCase();
  acMatches = (q ? all.filter(n => n.toLowerCase().includes(q)) : all).slice(0, 8);
  if (!acMatches.length) { acList.classList.remove('open'); return; }
  acActive = -1; acList.innerHTML = acMatches.map((n, i) => `<div class="ac-item" data-idx="${i}"><span class="ico">▸</span><span>${n}</span></div>`).join('');
  acList.classList.add('open');
  acList.querySelectorAll('.ac-item').forEach(el => {
    el.addEventListener('mousedown', e => { e.preventDefault(); pickAc(parseInt(el.dataset.idx, 10)); });
    el.addEventListener('touchstart', e => { e.preventDefault(); pickAc(parseInt(el.dataset.idx, 10)); }, { passive: false });
  });
}
function closeAc() { acList.classList.remove('open'); acActive = -1; acMatches = []; }
function pickAc(idx) { if (idx >= 0 && idx < acMatches.length) { nameInput.value = acMatches[idx]; const found = getItems().find(i => i.name === nameInput.value); if (found && found.sku) $('sku').value = found.sku; closeAc(); nameInput.focus(); } }
nameInput.addEventListener('input', () => openAc(nameInput.value));
nameInput.addEventListener('focus', () => openAc(nameInput.value));
nameInput.addEventListener('blur', () => setTimeout(closeAc, 150));

/* ==================== ОПЕРАЦИИ ==================== */
function areaOf(i) { return (i.width / 1000) * (i.length / 1000) * (i.qty || 1); }
function addItem() {
  const sku = $('sku').value.trim(), name = $('name').value.trim(), width = parseFloat($('width').value), len = parseFloat($('length').value), thick = parseFloat($('thick').value), qty = parseInt($('qty').value, 10) || 1;
  if (!name) return alert('Введите материал');
  if (!(width > 0) || !(len > 0) || !(thick > 0)) return alert('Размеры должны быть положительными');
  const result = addOrMergeItem({ id: uid(), sku, name, width, length: len, thick, qty });
  render();
  $('sku').value = ''; $('name').value = ''; $('width').value = ''; $('length').value = ''; $('thick').value = ''; $('qty').value = '';
  closeAc(); $('name').focus(); if (result === 'merged') showMergeToast(name);
}
function removeItem(id) { if (!confirm('Удалить запись?')) return; setItems(getItems().filter(i => i.id !== id)); render(); }
function clearAll() { if (!getItems().length) return; if (!confirm(`Удалить все записи из списка "${currentList().name}"?`)) return; setItems([]); render(); }

/* ==================== РЕДАКТИРОВАНИЕ ==================== */
function openEdit(id) {
  const item = getItems().find(i => i.id === id); if (!item) return; editingId = id;
  $('editSku').value = item.sku || ''; $('editName').value = item.name; $('editWidth').value = item.width; $('editLength').value = item.length; $('editThick').value = item.thick; $('editQty').value = item.qty || 1;
  $('editModal').classList.add('open'); setTimeout(() => $('editName').focus(), 100);
}
function closeEdit() { $('editModal').classList.remove('open'); editingId = null; }
function saveEdit() {
  if (!editingId) return;
  const sku = $('editSku').value.trim(), name = $('editName').value.trim(), width = parseFloat($('editWidth').value), len = parseFloat($('editLength').value), thick = parseFloat($('editThick').value), qty = parseInt($('editQty').value, 10) || 1;
  if (!name) return alert('Введите материал'); if (!(width > 0) || !(len > 0) || !(thick > 0)) return alert('Размеры должны быть положительными');
  const items = getItems(); const idx = items.findIndex(i => i.id === editingId); if (idx === -1) return closeEdit();
  const edited = { id: editingId, sku, name, width, length: len, thick, qty };
  const dupIdx = items.findIndex((x, i) => i !== idx && panelsEqual(x, edited));
  if (dupIdx !== -1) { if (confirm(`Такая панель уже есть. Прибавить количество?`)) { items[dupIdx].qty += qty; items.splice(idx, 1); } } else { items[idx] = edited; }
  setItems(items); closeEdit(); render();
}
$('editModal').addEventListener('click', e => { if (e.target === $('editModal')) closeEdit(); });

/* ==================== ТАБЛИЦА ==================== */
function getViewItems() {
  let view = getItems(); const q = searchQuery.trim().toLowerCase();
  if (q) view = view.filter(i => i.name.toLowerCase().includes(q) || (i.sku && i.sku.toLowerCase().includes(q)));
  view = [...view];
  if (sortKey === 'name') view.sort((a, b) => a.name.localeCompare(b.name, 'ru'));
  else if (sortKey === 'name-desc') view.sort((a, b) => b.name.localeCompare(a.name, 'ru'));
  else if (sortKey === 'area') view.sort((a, b) => areaOf(a) - areaOf(b));
  else if (sortKey === 'area-desc') view.sort((a, b) => areaOf(b) - areaOf(a));
  return view;
}
function groupItems(items) {
  const map = new Map();
  items.forEach(i => { const key = i.name.trim().toLowerCase(); if (!map.has(key)) map.set(key, { name: i.name.trim(), count: 0, panels: 0, area: 0 }); const g = map.get(key); g.count += 1; g.panels += i.qty || 1; g.area += areaOf(i); });
  return [...map.values()].sort((a, b) => a.name.localeCompare(b.name, 'ru'));
}
function renderTable() {
  const items = getViewItems(); const hasItems = items.length > 0; const totalInList = getItems().length;
  const emptyEl = $('empty'); if (!hasItems) { emptyEl.style.display = 'block'; emptyEl.textContent = totalInList === 0 ? 'Пока пусто. Добавьте первую панель.' : 'Ничего не найдено.'; } else { emptyEl.style.display = 'none'; }
  const tbody = $('tbody'); tbody.innerHTML = '';
  let totalArea = 0, totalPanels = 0;
  items.forEach(i => {
    const a = areaOf(i); totalArea += a; totalPanels += i.qty || 1;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><small style="color:var(--text-label)">${escapeHtml(i.sku || '—')}</small></td><td>${escapeHtml(i.name)}</td><td class="num">${i.width}</td><td class="num">${i.length}</td><td class="num">${i.thick}</td><td class="num">${i.qty || 1}</td><td class="num">${a.toFixed(3)}</td><td><button class="x" data-id="${i.id}">✕</button></td>`;
    tr.addEventListener('click', e => { if (!e.target.closest('.x')) openEdit(i.id); }); tbody.appendChild(tr);
  });
  tbody.querySelectorAll('.x').forEach(btn => { btn.addEventListener('click', e => { e.stopPropagation(); removeItem(btn.dataset.id); }); });
  if (viewMode === 'summary') { const groups = groupItems(items); $('tbodySummary').innerHTML = groups.map(g => `<tr><td>${escapeHtml(g.name)}</td><td class="num">${g.count}</td><td class="num">${g.panels}</td><td class="num">${g.area.toFixed(3)}</td></tr>`).join(''); }
  const sumBox = $('sum'); if (hasItems) { sumBox.style.display = 'block'; sumBox.innerHTML = `Панелей: <b>${totalPanels}</b> (позиций: ${items.length}) · Площадь: <b>${totalArea.toFixed(3)} м²</b>`; } else { sumBox.style.display = 'none'; }
  $('viewDetail').style.display = (viewMode === 'detail' && hasItems) ? 'block' : 'none'; $('viewSummary').style.display = (viewMode === 'summary' && hasItems) ? 'block' : 'none';
  $('tabDetail').classList.toggle('active', viewMode === 'detail'); $('tabSummary').classList.toggle('active', viewMode === 'summary');
}
function render() { renderListSelect(); renderTable(); }
function setView(mode) { viewMode = mode; renderTable(); }
$('searchBox').addEventListener('input', e => { searchQuery = e.target.value; renderTable(); });
$('sortSelect').addEventListener('change', e => { sortKey = e.target.value; renderTable(); });
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ==================== ЭКСПОРТ ==================== */
function buildWorkbook() {
  const items = getItems();
  const rows = items.map((i, n) => ({ '№': n + 1, 'Чертёж': i.sku || '', 'Материал': i.name, 'Ширина, мм': i.width, 'Длина, мм': i.length, 'Толщина, мм': i.thick, 'Кол-во': i.qty || 1, 'Площадь, м²': +areaOf(i).toFixed(3) }));
  const ws = XLSX.utils.json_to_sheet(rows); ws['!cols'] = [{wch:5},{wch:18},{wch:25},{wch:12},{wch:12},{wch:12},{wch:8},{wch:12}];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'ЛДСП'); return wb;
}
function getFileName() { const safeName = currentList().name.replace(/[\\/:*?"<>|]/g, '_').trim() || 'ЛДСП'; return `${safeName}_${new Date().toISOString().slice(0,10)}.xlsx`; }
function exportExcel() { if (!getItems().length) return alert('Список пуст'); XLSX.writeFile(buildWorkbook(), getFileName()); }
async function shareExcel() {
  if (!getItems().length) return alert('Список пуст');
  const wb = buildWorkbook(); const xlsxFileName = getFileName(); const csvFileName = xlsxFileName.replace('.xlsx', '.csv');
  const wboutXlsx = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  const xlsxBlob = new Blob([wboutXlsx], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const xlsxFile = new File([xlsxBlob], xlsxFileName, { type: xlsxBlob.type });
  if (navigator.canShare && navigator.canShare({ files: [xlsxFile] })) { try { await navigator.share({ files: [xlsxFile], title: currentList().name }); return; } catch (err) { if (err.name === 'AbortError') return; } }
  const csvContent = "\uFEFF" + XLSX.utils.sheet_to_csv(XLSX.utils.json_to_sheet(getItems()), { FS: ';' });
  const csvBlob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const csvFile = new File([csvBlob], csvFileName, { type: 'text/csv' });
  if (navigator.canShare && navigator.canShare({ files: [csvFile] })) { try { await navigator.share({ files: [csvFile], title: currentList().name }); return; } catch (err) { if (err.name === 'AbortError') return; } }
  const url = URL.createObjectURL(xlsxBlob); const a = document.createElement('a'); a.href = url; a.download = xlsxFileName;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(() => URL.revokeObjectURL(url), 30000);
  alert('Меню "Поделиться" недоступно на этом устройстве. Файл сохранён в папку "Загрузки".');
}

/* ==================== QR И OCR ==================== */
let qrScanner = null;
async function openScanner() {
  $('scanModal').classList.add('open'); $('ocrLoader').style.display = 'none';
  if (typeof Html5Qrcode === 'undefined') { alert('Библиотека сканера не загрузилась.'); closeScanner(); return; }
  if (!qrScanner) qrScanner = new Html5Qrcode("qrReader", { verbose: false });
  try {
    await qrScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 280, height: 280 } }, text => { closeScanner().then(() => handleQrContent(text)); }, () => {});
  } catch (err) { closeScanner(); alert('Не удалось открыть камеру.\n\n' + (err.message || err)); }
}
async function closeScanner() { $('scanModal').classList.remove('open'); if (qrScanner) { try { await qrScanner.stop(); } catch(e) {} try { await qrScanner.clear(); } catch(e) {} } }

async function handleQrFile(event) {
  const file = event.target.files[0]; if (!file) return;
  await closeScanner();
  await new Promise(r => setTimeout(r, 100));

  if (typeof Html5Qrcode === 'undefined') { alert('Библиотека сканера не загрузилась.'); event.target.value = ''; return; }
  if (!qrScanner) qrScanner = new Html5Qrcode("qrReader", { verbose: false });

  try {
    const text = await qrScanner.scanFile(file, false);
    event.target.value = ''; handleQrContent(text); return;
  } catch (err) {
    console.log('QR not found on image, starting OCR...');
  }

  try {
    $('scanModal').classList.add('open');
    $('ocrLoader').style.display = 'block';
    
    const worker = await Tesseract.createWorker('rus');
    const ret = await worker.recognize(file);
    const text = ret.data.text;
    await worker.terminate();
    
    $('ocrLoader').style.display = 'none';
    await closeScanner();
    event.target.value = '';

    let width = 0, length = 0, thick = 0;
    const dimRegex = /(\d{2,4}(?:[.,]\d)?)\s*[xXхХ×*]\s*(\d{2,4}(?:[.,]\d)?)\s*[xXхХ×*]\s*(\d{1,2})/;
    const dimMatch = text.match(dimRegex);
    if (dimMatch) {
        width = parseFloat(dimMatch[1].replace(',', '.'));
        length = parseFloat(dimMatch[2].replace(',', '.'));
        thick = parseFloat(dimMatch[3]);
    }

    let material = '';
    const lines = text.split('\n').map(l => l.trim());
    let materialLine = lines.find(l => l.includes('ЛДСП') || l.includes('МДФ') || l.includes('ДСП'));
    
    if (materialLine) {
        materialLine = materialLine.replace(/Карта\s*-\s*\d+\s*Бирка\s*-\s*\d+/i, '').trim();
        materialLine = materialLine.replace(/\s+W\d+.*$/i, '').trim(); 
        materialLine = materialLine.replace(/\s*\d+\s*мм,?\s*/i, ' ').trim(); 
        materialLine = materialLine.replace(/^[,\s-]+|[,\s-]+$/g, '');
        material = materialLine;
    } else {
        for (let line of lines) {
            if (line.length > 3 && !/^[0-9\s.,xX×*]+$/.test(line) && !line.includes('Карта') && !line.includes('izdeg') && !line.includes('Бирка') && !line.includes('поз')) {
                material = line;
                break;
            }
        }
    }

    let sku = '';
    const skuMatch = text.match(/(izdeg\s*\d+(?:[.\s]\d+)*)/i);
    if (skuMatch) {
        sku = skuMatch[1].replace(/\s+/g, '').replace(/поз.*/i, '');
    }

    if (dimMatch || material) {
        showScanConfirm([{ 
            id: uid(), 
            sku: sku, 
            name: material || 'Панель', 
            width: width, 
            length: length, 
            thick: thick || 16, 
            qty: 1 
        }]);
    } else {
        if (confirm('Текст распознан, но нужные данные не найдены.\n\nТекст:\n' + text + '\n\nОткрыть форму для ручного ввода?')) {
            showScanConfirm([{ id: uid(), sku: '', name: '', width: 0, length: 0, thick: 16, qty: 1 }]);
        }
    }
  } catch (err) {
    $('ocrLoader').style.display = 'none'; await closeScanner(); event.target.value = '';
    alert('Не удалось распознать ни QR, ни текст на фото.\nПопробуйте сфотографировать бирку крупнее и без бликов.');
    console.error(err);
  }
}

function handleQrContent(text) {
  text = String(text || '').trim(); if (!text) return;
  const parsed = parsePanelText(text);
  if (parsed && parsed.length) { showScanConfirm(parsed); return; }
  if (confirm('Не удалось распознать данные.\n\nСодержимое QR:\n' + text + '\n\nИспользовать как ID чертежа?')) {
    $('sku').value = text; $('sku').focus();
  }
}

function parsePanelText(text) {
  const tryJson = (s) => {
    try { const data = JSON.parse(s); const arr = Array.isArray(data) ? data : (data.items || [data]); return arr.map(x => ({ sku: String(x.n || x.name || x.sku || x.id || '').trim(), name: String(x.material || x.naimenovanie || 'Панель').trim(), width: +x.w || +x.width || 0, length: +x.l || +x.length || 0, thick: +x.t || +x.thick || 16, qty: +x.q || +x.qty || 1 })); } catch { return null; }
  };
  if (text.startsWith('{') || text.startsWith('[')) { const r = tryJson(text); if (r && r.length) return r.filter(x => x.width > 0).map(toItem); }
  if (/^(izdeg|ldsp|panel)[a-z0-9.\-_]+/i.test(text) || /\.ldw$/i.test(text)) { return [toItem({ sku: text, name: '', width: 0, length: 0, thick: 16, qty: 1 })]; }
  return null;
  
  function toItem(x) { return { id: uid(), sku: x.sku, name: x.name, width: x.width, length: x.length, thick: x.thick, qty: Math.max(1, Math.floor(+x.qty || 1)) }; }
}

function showScanConfirm(items) {
  const it = items[0];
  $('scanRaw').textContent = 'ID: ' + (it.sku || '—');
  
  if (it.sku) {
    const existing = getItems().find(x => x.sku === it.sku);
    if (existing) {
      it.name = existing.name; it.width = existing.width; it.length = existing.length; it.thick = existing.thick;
      $('scanRaw').textContent += ' (загружено из памяти)';
    }
  }

  $('scanSku').value = it.sku; $('scanName').value = it.name;
  $('scanWidth').value = it.width || ''; $('scanLength').value = it.length || ''; $('scanThick').value = it.thick || 16;
  $('scanQty').value = it.qty || 1;
  $('scanConfirmModal').classList.add('open');
}
function cancelScanConfirm() { $('scanConfirmModal').classList.remove('open'); }
function confirmScanAdd() {
  const sku = $('scanSku').value.trim(), name = $('scanName').value.trim(), width = parseFloat($('scanWidth').value), length = parseFloat($('scanLength').value), thick = parseFloat($('scanThick').value), qty = parseInt($('scanQty').value, 10) || 1;
  if (!name) return alert('Введите материал');
  if (!(width > 0) || !(length > 0) || !(thick > 0)) return alert('Размеры должны быть положительными');
  const result = addOrMergeItem({ id: uid(), sku, name, width, length, thick, qty });
  render(); cancelScanConfirm(); if (result === 'merged') showMergeToast(name);
  setTimeout(openScanner, 300);
}
$('scanConfirmModal').addEventListener('click', e => { if (e.target === $('scanConfirmModal')) cancelScanConfirm(); });

/* ==================== ИМПОРТ ==================== */
function findCol(keys, keywords, exacts = []) {
  for (const k of keys) { const low = k.toLowerCase().trim(); if (keywords.some(kw => low.includes(kw))) return k; }
  for (const k of keys) { if (exacts.includes(k.toLowerCase().trim())) return k; }
  return null;
}
function handleFile(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]]; const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
      if (!rows.length) throw new Error('Файл пуст');
      const keys = Object.keys(rows[0]);
      const kName = findCol(keys, ['материал', 'наименован', 'name'], ['имя']);
      const kW = findCol(keys, ['ширин', 'width'], ['ш']);
      const kL = findCol(keys, ['длин', 'length'], ['д']);
      const kT = findCol(keys, ['толщин', 'thick', 'толщ'], ['т']);
      const kQ = findCol(keys, ['количеств', 'кол-во', 'кол', 'qty']);
      const kSku = findCol(keys, ['чертеж', 'артикул', 'id', 'путь', 'sku']);
      
      if (!kName || !kW || !kL || !kT) throw new Error('Не найдены нужные колонки.');
      const toNum = v => parseFloat(String(v).replace(',', '.'));
      const items = [];
      for (const r of rows) {
        const name = String(r[kName] ?? '').trim(); const w = toNum(r[kW]); const l = toNum(r[kL]); const t = toNum(r[kT]);
        const q = kQ ? Math.max(1, Math.floor(toNum(r[kQ]) || 1)) : 1;
        const sku = kSku ? String(r[kSku] ?? '').trim() : '';
        if (name && w > 0 && l > 0 && t > 0) items.push({ id: uid(), sku, name, width: w, length: l, thick: t, qty: q });
      }
      if (!items.length) throw new Error('Нет корректных строк');
      askImport(items);
    } catch (err) { alert('Ошибка импорта: ' + err.message); }
    e.target.value = '';
  };
  reader.readAsArrayBuffer(file);
}
function dedupeItems(arr) { const out = []; arr.forEach(item => { const idx = out.findIndex(x => panelsEqual(x, item)); if (idx !== -1) out[idx].qty += (item.qty || 1); else out.push({ ...item }); }); return out; }
function mergeItemArrays(base, incoming) { const out = base.map(x => ({ ...x })); incoming.forEach(item => { const idx = out.findIndex(x => panelsEqual(x, item)); if (idx !== -1) out[idx].qty += (item.qty || 1); else out.push({ ...item }); }); return out; }
function askImport(items) {
  const cur = currentList(); const incoming = dedupeItems(items);
  if (!cur.items.length) { setItems(incoming); saveState(); render(); return; }
  const replace = confirm(`Найдено ${incoming.length} строк.\n\nОК — ЗАМЕНИТЬ\nОтмена — ДОБАВИТЬ в конец`);
  if (replace) setItems(incoming); else setItems(mergeItemArrays(cur.items, incoming));
  saveState(); render();
}

/* ==================== СТАРТ ==================== */
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
