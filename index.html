<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>Учёт ЛДСП</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #f5f5f5; color: #222;
    padding: 16px; padding-bottom: calc(20px + env(safe-area-inset-bottom));
    max-width: 1100px; margin: 0 auto;
  }

  /* ---- Логотип сверху по центру, на белом ---- */
  .logo-bar {
    background: #fff; border-radius: 12px;
    padding: 16px; margin: 0 0 14px;
    box-shadow: 0 2px 10px rgba(0,0,0,.07);
    display: flex; align-items: center; justify-content: center;
  }
  .logo-bar img {
    height: 56px; width: auto; max-width: 220px;
    object-fit: contain; display: block;
  }

  h1 { font-size: 22px; margin: 0 0 14px; }

  /* ---- Списки (верхняя панель) ---- */
  .list-bar {
    display: flex; gap: 8px; align-items: center;
    background: #fff; border-radius: 12px; padding: 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.07);
    margin-bottom: 14px; flex-wrap: wrap;
  }
  .list-bar select {
    flex: 1; min-width: 180px;
    padding: 12px 14px; font-size: 16px; font-weight: 500;
    border: 1.5px solid #d0d0d0; border-radius: 10px; background: #fafafa;
    color: #222;
  }
  .list-bar select:focus { outline: none; border-color: #4f46e5; }
  .icon-btn {
    width: 46px; height: 46px; padding: 0; font-size: 18px;
    background: #eef2ff; color: #4f46e5; border-radius: 10px;
    flex-shrink: 0; border: 0; cursor: pointer;
  }
  .icon-btn.danger { background: #fee2e2; color: #dc2626; }

  .card {
    background: #fff; border-radius: 14px; padding: 20px;
    box-shadow: 0 2px 10px rgba(0,0,0,.07); margin-bottom: 16px;
  }
  label { display: block; font-size: 15px; margin: 0 0 6px; color: #555; font-weight: 500; }
  input[type="text"], input[type="number"], input:not([type]) {
    width: 100%; padding: 14px 16px; font-size: 17px;
    border: 1.5px solid #d0d0d0; border-radius: 10px; background: #fafafa;
  }
  input:focus { outline: none; border-color: #4f46e5; background: #fff; }

  .form-grid {
    display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
    gap: 14px; align-items: end;
  }
  @media (max-width: 800px) {
    .form-grid { grid-template-columns: 1fr 1fr; }
    .form-grid .full { grid-column: 1 / -1; }
  }

  button {
    padding: 16px; font-size: 17px; border: 0; border-radius: 10px;
    background: #4f46e5; color: #fff; cursor: pointer; font-weight: 500;
    transition: transform .05s, filter .15s;
  }
  button:active { transform: scale(.98); filter: brightness(.92); }
  button.sec { background: #16a34a; }
  button.imp { background: #0ea5e9; }
  button.shr { background: #9333ea; }
  button.del { background: #dc2626; }
  .add-btn { margin-top: 18px; width: 100%; font-size: 18px; padding: 18px; }

  /* ---- Панель поиска и сортировки ---- */
  .table-toolbar {
    display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap;
  }
  .table-toolbar input[type="text"] {
    flex: 1; min-width: 180px;
    padding: 12px 14px; font-size: 16px;
    border: 1.5px solid #d0d0d0; border-radius: 10px; background: #fafafa;
  }
  .table-toolbar select {
    padding: 12px 14px; font-size: 15px;
    border: 1.5px solid #d0d0d0; border-radius: 10px; background: #fafafa;
    min-width: 170px; color: #222;
  }
  .table-toolbar input:focus, .table-toolbar select:focus {
    outline: none; border-color: #4f46e5; background: #fff;
  }

  /* ---- Табы Детально/Сводка ---- */
  .view-tabs {
    display: flex; margin-bottom: 12px;
    background: #f0f0f0; border-radius: 10px; padding: 4px; gap: 4px;
  }
  .view-tabs .tab {
    flex: 1; padding: 10px; background: transparent; color: #555;
    border-radius: 8px; font-size: 15px; font-weight: 500;
    border: 0; margin: 0;
  }
  .view-tabs .tab.active {
    background: #fff; color: #4f46e5;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }

  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 16px; }
  th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #eee; }
  th { background: #f0f0f0; font-weight: 600; font-size: 14px;
       text-transform: uppercase; letter-spacing: .03em; color: #555; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  th.num { text-align: right; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #fafaff; }
  .x {
    background: #fee2e2; color: #dc2626; border: 0;
    width: 40px; height: 40px; border-radius: 8px;
    font-size: 20px; cursor: pointer; padding: 0;
    position: relative; z-index: 1;
  }
  .empty { color: #999; text-align: center; padding: 40px 20px; font-size: 16px; }
  .sum { font-size: 15px; color: #444; margin: 14px 0 0; padding: 12px;
         background: #f0f4ff; border-radius: 8px; }
  .sum b { color: #4f46e5; }

  .actions {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px; margin-top: 16px;
  }

  /* ---- Автодополнение ---- */
  .ac-wrap { position: relative; }
  .ac-list {
    position: absolute; left: 0; right: 0; top: calc(100% + 4px);
    background: #fff; border: 1px solid #e0e0e0; border-radius: 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,.12);
    max-height: 280px; overflow-y: auto;
    z-index: 50; display: none; padding: 4px;
  }
  .ac-list.open { display: block; }
  .ac-item {
    padding: 14px; font-size: 16px; border-radius: 8px;
    cursor: pointer; display: flex; align-items: center; gap: 10px;
  }
  .ac-item:hover, .ac-item.active { background: #eef2ff; }
  .ac-item .ico { color: #4f46e5; font-size: 14px; flex-shrink: 0; }
  .ac-item mark { background: #fde68a; color: inherit; padding: 0 1px; border-radius: 2px; }

  /* ---- Модальное окно редактирования ---- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    display: none; align-items: center; justify-content: center;
    z-index: 100; padding: 16px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #fff; border-radius: 14px; padding: 24px;
    max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  .modal h2 { margin: 0 0 16px; font-size: 20px; }
  .modal .row-3 {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 10px; margin-top: 4px;
  }
  .modal-actions {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px; margin-top: 20px;
  }
  .btn-cancel { background: #e5e7eb; color: #333; }

  @media (max-width: 500px) {
    .logo-bar img { height: 44px; }
    h1 { font-size: 18px; }
  }
</style>
</head>
<body>

<div class="logo-bar">
  <img src="parma.svg" alt="Parma">
</div>

<h1>📐 Учёт панелей ЛДСП</h1>

<div class="list-bar">
  <select id="listSelect" onchange="switchList(this.value)"></select>
  <button class="icon-btn" onclick="newList()" title="Новый список">➕</button>
  <button class="icon-btn" onclick="renameList()" title="Переименовать">✏️</button>
  <button class="icon-btn danger" onclick="deleteList()" title="Удалить список">🗑</button>
</div>

<div class="card">
  <div class="form-grid">
    <div class="full">
      <label>Наименование</label>
      <div class="ac-wrap">
        <input id="name" type="text" placeholder="Начните вводить — появятся подсказки" autocomplete="off">
        <div class="ac-list" id="acList"></div>
      </div>
    </div>
    <div>
      <label>Ширина, мм</label>
      <input id="width" type="number" inputmode="numeric" placeholder="600">
    </div>
    <div>
      <label>Длина, мм</label>
      <input id="length" type="number" inputmode="numeric" placeholder="1200">
    </div>
    <div>
      <label>Толщина, мм</label>
      <input id="thick" type="number" inputmode="numeric" placeholder="16">
    </div>
    <div>
      <label>Количество</label>
      <input id="qty" type="number" inputmode="numeric" min="1" placeholder="1">
    </div>
  </div>
  <button class="add-btn" onclick="addItem()">➕ Добавить панель</button>
</div>

<div class="card">
  <div class="table-toolbar">
    <input type="text" id="searchBox" placeholder="🔍 Поиск по наименованию" autocomplete="off">
    <select id="sortSelect">
      <option value="default">Без сортировки</option>
      <option value="name">Наименование ↑</option>
      <option value="name-desc">Наименование ↓</option>
      <option value="area">Площадь ↑</option>
      <option value="area-desc">Площадь ↓</option>
    </select>
  </div>

  <div class="view-tabs">
    <button class="tab active" id="tabDetail" onclick="setView('detail')">Детально</button>
    <button class="tab" id="tabSummary" onclick="setView('summary')">Сводка</button>
  </div>

  <div id="empty" class="empty">Пока пусто. Добавьте первую панель.</div>

  <div id="viewDetail">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Наименование</th>
            <th class="num">Ш, мм</th>
            <th class="num">Д, мм</th>
            <th class="num">Т, мм</th>
            <th class="num">Кол-во</th>
            <th class="num">Площадь, м²</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <div id="viewSummary" style="display:none">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Наименование</th>
            <th class="num">Позиций</th>
            <th class="num">Панелей, шт</th>
            <th class="num">Площадь, м²</th>
          </tr>
        </thead>
        <tbody id="tbodySummary"></tbody>
      </table>
    </div>
  </div>

  <div class="sum" id="sum" style="display:none"></div>

  <div class="actions">
    <button class="sec" onclick="exportExcel()">📥 Скачать Excel</button>
    <button class="shr" onclick="shareExcel()">📤 Поделиться</button>
    <button class="imp" onclick="document.getElementById('fileInput').click()">📂 Импорт Excel</button>
    <button class="del" onclick="clearAll()">🗑 Очистить</button>
  </div>
  <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none" onchange="handleFile(event)">
</div>

<!-- Модальное окно редактирования -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h2>✏️ Редактировать панель</h2>
    <label>Наименование</label>
    <input type="text" id="editName" autocomplete="off">
    <div class="row-3">
      <div>
        <label>Ширина, мм</label>
        <input type="number" inputmode="numeric" id="editWidth">
      </div>
      <div>
        <label>Длина, мм</label>
        <input type="number" inputmode="numeric" id="editLength">
      </div>
      <div>
        <label>Толщина, мм</label>
        <input type="number" inputmode="numeric" id="editThick">
      </div>
    </div>
    <label>Количество</label>
    <input type="number" inputmode="numeric" id="editQty" min="1">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeEdit()">Отмена</button>
      <button onclick="saveEdit()">Сохранить</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
/* ==================== ХРАНИЛИЩЕ ==================== */
const STORAGE_KEY = 'ldsp_lists_v1';
const OLD_KEY = 'ldsp_items_v1';
const $ = id => document.getElementById(id);

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function migrateItems(arr) {
  if (!Array.isArray(arr)) return [];
  return arr.map(i => ({
    id: i.id || uid(),
    name: String(i.name || '').trim(),
    width: Number(i.width) || 0,
    length: Number(i.length) || 0,
    thick: Number(i.thick) || 0,
    qty: Number.isFinite(+i.qty) && +i.qty > 0 ? Math.floor(+i.qty) : 1
  }));
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && Array.isArray(s.lists) && s.lists.length) {
        s.lists.forEach(l => { l.items = migrateItems(l.items); });
        return s;
      }
    }
  } catch (e) { console.error(e); }

  let oldItems = [];
  try { oldItems = JSON.parse(localStorage.getItem(OLD_KEY) || '[]'); } catch {}
  const list = { id: uid(), name: 'Список 1', items: migrateItems(oldItems) };
  const s = { lists: [list], currentListId: list.id };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
  return s;
}

let state = loadState();
let searchQuery = '';
let sortKey = 'default';
let viewMode = 'detail';
let editingId = null;

function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function currentList() { return state.lists.find(l => l.id === state.currentListId) || state.lists[0]; }
function getItems() { return currentList().items; }
function setItems(items) { currentList().items = items; saveState(); }

/* ==================== УПРАВЛЕНИЕ СПИСКАМИ ==================== */
function renderListSelect() {
  const sel = $('listSelect');
  sel.innerHTML = '';
  state.lists.forEach(l => {
    const opt = document.createElement('option');
    opt.value = l.id;
    opt.textContent = `${l.name} (${l.items.length})`;
    if (l.id === state.currentListId) opt.selected = true;
    sel.appendChild(opt);
  });
}

function switchList(id) {
  state.currentListId = id;
  saveState();
  closeAc();
  searchQuery = '';
  $('searchBox').value = '';
  render();
}

function newList() {
  const name = prompt('Название нового списка:', `Список ${state.lists.length + 1}`);
  if (name === null) return;
  const trimmed = name.trim() || `Список ${state.lists.length + 1}`;
  const list = { id: uid(), name: trimmed, items: [] };
  state.lists.push(list);
  state.currentListId = list.id;
  saveState();
  closeAc();
  searchQuery = '';
  $('searchBox').value = '';
  render();
}

function renameList() {
  const l = currentList();
  const name = prompt('Новое название:', l.name);
  if (name === null) return;
  const trimmed = name.trim();
  if (!trimmed) return;
  l.name = trimmed;
  saveState();
  renderListSelect();
}

function deleteList() {
  if (state.lists.length <= 1) {
    alert('Нельзя удалить единственный список');
    return;
  }
  const l = currentList();
  if (!confirm(`Удалить список "${l.name}" (${l.items.length} записей)?`)) return;
  state.lists = state.lists.filter(x => x.id !== l.id);
  state.currentListId = state.lists[0].id;
  saveState();
  searchQuery = '';
  $('searchBox').value = '';
  render();
}

/* ==================== АВТОДОПОЛНЕНИЕ ==================== */
const nameInput = $('name');
const acList = $('acList');
let acMatches = [];
let acActive = -1;

function uniqueNames() {
  const set = new Set(getItems().map(i => i.name.trim()));
  return [...set].filter(Boolean).sort((a, b) => a.localeCompare(b, 'ru'));
}

function highlight(text, query) {
  if (!query) return escapeHtml(text);
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1) return escapeHtml(text);
  return escapeHtml(text.slice(0, idx))
       + '<mark>' + escapeHtml(text.slice(idx, idx + query.length)) + '</mark>'
       + escapeHtml(text.slice(idx + query.length));
}

function openAc(query) {
  const all = uniqueNames();
  const q = query.trim().toLowerCase();
  acMatches = (q ? all.filter(n => n.toLowerCase().includes(q)) : all).slice(0, 8);
  if (!acMatches.length) { acList.classList.remove('open'); return; }
  acActive = -1;
  acList.innerHTML = acMatches.map((n, i) =>
    `<div class="ac-item" data-idx="${i}"><span class="ico">▸</span><span>${highlight(n, q)}</span></div>`
  ).join('');
  acList.classList.add('open');
  acList.querySelectorAll('.ac-item').forEach(el => {
    el.addEventListener('mousedown', e => { e.preventDefault(); pickAc(parseInt(el.dataset.idx, 10)); });
    el.addEventListener('touchstart', e => { e.preventDefault(); pickAc(parseInt(el.dataset.idx, 10)); }, { passive: false });
  });
}

function closeAc() { acList.classList.remove('open'); acActive = -1; acMatches = []; }

function pickAc(idx) {
  if (idx < 0 || idx >= acMatches.length) return;
  nameInput.value = acMatches[idx];
  closeAc();
  nameInput.focus();
}

nameInput.addEventListener('input', () => openAc(nameInput.value));
nameInput.addEventListener('focus', () => openAc(nameInput.value));
nameInput.addEventListener('blur', () => setTimeout(closeAc, 150));
nameInput.addEventListener('keydown', e => {
  if (!acList.classList.contains('open')) return;
  const els = acList.querySelectorAll('.ac-item');
  if (e.key === 'ArrowDown') { e.preventDefault(); acActive = (acActive + 1) % els.length; updateActive(els); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); acActive = (acActive - 1 + els.length) % els.length; updateActive(els); }
  else if (e.key === 'Enter' && acActive >= 0) { e.preventDefault(); pickAc(acActive); }
  else if (e.key === 'Escape') closeAc();
});

function updateActive(els) {
  els.forEach((el, i) => el.classList.toggle('active', i === acActive));
  if (acActive >= 0 && els[acActive]) els[acActive].scrollIntoView({ block: 'nearest' });
}

/* ==================== ОСНОВНЫЕ ОПЕРАЦИИ ==================== */
function areaOf(i) {
  return (i.width / 1000) * (i.length / 1000) * (i.qty || 1);
}

function addItem() {
  const name  = $('name').value.trim();
  const width = parseFloat($('width').value);
  const len   = parseFloat($('length').value);
  const thick = parseFloat($('thick').value);
  const qtyStr = $('qty').value.trim();
  const qty = qtyStr === '' ? 1 : parseInt(qtyStr, 10);

  if (!name) return alert('Введите наименование');
  if (!(width > 0) || !(len > 0) || !(thick > 0))
    return alert('Ширина, длина и толщина должны быть положительными');
  if (!(qty >= 1)) return alert('Количество должно быть не меньше 1');

  const items = getItems();
  items.push({ id: uid(), name, width, length: len, thick, qty });
  setItems(items);
  render();

  $('name').value = ''; $('width').value = '';
  $('length').value = ''; $('thick').value = ''; $('qty').value = '';
  closeAc();
  $('name').focus();
}

function removeItem(id) {
  if (!confirm('Удалить запись?')) return;
  setItems(getItems().filter(i => i.id !== id));
  render();
}

function clearAll() {
  if (!getItems().length) return;
  if (!confirm(`Удалить все записи из списка "${currentList().name}"?`)) return;
  setItems([]);
  render();
}

/* ==================== РЕДАКТИРОВАНИЕ ==================== */
function openEdit(id) {
  const item = getItems().find(i => i.id === id);
  if (!item) return;
  editingId = id;
  $('editName').value = item.name;
  $('editWidth').value = item.width;
  $('editLength').value = item.length;
  $('editThick').value = item.thick;
  $('editQty').value = item.qty || 1;
  $('editModal').classList.add('open');
  setTimeout(() => $('editName').focus(), 100);
}

function closeEdit() {
  $('editModal').classList.remove('open');
  editingId = null;
}

function saveEdit() {
  if (!editingId) return;
  const name = $('editName').value.trim();
  const width = parseFloat($('editWidth').value);
  const len = parseFloat($('editLength').value);
  const thick = parseFloat($('editThick').value);
  const qty = parseInt($('editQty').value, 10);

  if (!name) return alert('Введите наименование');
  if (!(width > 0) || !(len > 0) || !(thick > 0))
    return alert('Ширина, длина и толщина должны быть положительными');
  if (!(qty >= 1)) return alert('Количество должно быть не меньше 1');

  const items = getItems();
  const idx = items.findIndex(i => i.id === editingId);
  if (idx === -1) return closeEdit();
  items[idx] = { ...items[idx], name, width, length: len, thick, qty };
  setItems(items);
  closeEdit();
  render();
}

$('editModal').addEventListener('click', e => {
  if (e.target === $('editModal')) closeEdit();
});
document.addEventListener('keydown', e => {
  if ($('editModal').classList.contains('open') && e.key === 'Escape') closeEdit();
});

/* ==================== ОТРИСОВКА ТАБЛИЦЫ ==================== */
function getViewItems() {
  let view = getItems();
  const q = searchQuery.trim().toLowerCase();
  if (q) view = view.filter(i => i.name.toLowerCase().includes(q));
  view = [...view];
  if (sortKey === 'name') view.sort((a, b) => a.name.localeCompare(b.name, 'ru'));
  else if (sortKey === 'name-desc') view.sort((a, b) => b.name.localeCompare(a.name, 'ru'));
  else if (sortKey === 'area') view.sort((a, b) => areaOf(a) - areaOf(b));
  else if (sortKey === 'area-desc') view.sort((a, b) => areaOf(b) - areaOf(a));
  return view;
}

function groupItems(items) {
  const map = new Map();
  items.forEach(i => {
    const key = i.name.trim().toLowerCase();
    if (!map.has(key)) map.set(key, { name: i.name.trim(), count: 0, panels: 0, area: 0 });
    const g = map.get(key);
    g.count += 1;
    g.panels += i.qty || 1;
    g.area += areaOf(i);
  });
  return [...map.values()].sort((a, b) => a.name.localeCompare(b.name, 'ru'));
}

function renderTable() {
  const items = getViewItems();
  const hasItems = items.length > 0;
  const totalInList = getItems().length;

  // Empty state
  const emptyEl = $('empty');
  if (!hasItems) {
    emptyEl.style.display = 'block';
    emptyEl.textContent = totalInList === 0
      ? 'Пока пусто. Добавьте первую панель.'
      : 'Ничего не найдено по запросу.';
  } else {
    emptyEl.style.display = 'none';
  }

  // Detail table
  const tbody = $('tbody');
  tbody.innerHTML = '';
  let totalArea = 0, totalPanels = 0;
  items.forEach(i => {
    const a = areaOf(i);
    totalArea += a;
    totalPanels += i.qty || 1;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${escapeHtml(i.name)}</td>
      <td class="num">${i.width}</td>
      <td class="num">${i.length}</td>
      <td class="num">${i.thick}</td>
      <td class="num">${i.qty || 1}</td>
      <td class="num">${a.toFixed(3)}</td>
      <td><button class="x" data-id="${i.id}" aria-label="Удалить">✕</button></td>`;
    tr.addEventListener('click', e => {
      if (e.target.closest('.x')) return;
      openEdit(i.id);
    });
    tbody.appendChild(tr);
  });
  tbody.querySelectorAll('.x').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      removeItem(btn.dataset.id);
    });
  });

  // Summary table
  if (viewMode === 'summary') {
    const groups = groupItems(items);
    $('tbodySummary').innerHTML = groups.map(g => `
      <tr>
        <td>${escapeHtml(g.name)}</td>
        <td class="num">${g.count}</td>
        <td class="num">${g.panels}</td>
        <td class="num">${g.area.toFixed(3)}</td>
      </tr>
    `).join('');
  }

  // Sum
  const sumBox = $('sum');
  if (hasItems) {
    sumBox.style.display = 'block';
    sumBox.innerHTML = `Панелей: <b>${totalPanels}</b> (позиций: ${items.length}) · Площадь: <b>${totalArea.toFixed(3)} м²</b>`;
  } else {
    sumBox.style.display = 'none';
  }

  // Toggle views
  $('viewDetail').style.display = (viewMode === 'detail' && hasItems) ? 'block' : 'none';
  $('viewSummary').style.display = (viewMode === 'summary' && hasItems) ? 'block' : 'none';
  $('tabDetail').classList.toggle('active', viewMode === 'detail');
  $('tabSummary').classList.toggle('active', viewMode === 'summary');
}

function render() {
  renderListSelect();
  renderTable();
}

function setView(mode) {
  viewMode = mode;
  renderTable();
}

$('searchBox').addEventListener('input', e => {
  searchQuery = e.target.value;
  renderTable();
});
$('sortSelect').addEventListener('change', e => {
  sortKey = e.target.value;
  renderTable();
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

/* ==================== ЭКСПОРТ ==================== */
function buildWorkbook() {
  const items = getItems();
  const rows = items.map((i, n) => ({
    '№': n + 1,
    'Наименование': i.name,
    'Ширина, мм': i.width,
    'Длина, мм': i.length,
    'Толщина, мм': i.thick,
    'Кол-во': i.qty || 1,
    'Площадь, м²': +areaOf(i).toFixed(3)
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:5},{wch:28},{wch:12},{wch:12},{wch:12},{wch:8},{wch:12}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'ЛДСП');
  return wb;
}

function getFileName() {
  const safeName = currentList().name.replace(/[\\/:*?"<>|]/g, '_').trim() || 'ЛДСП';
  const date = new Date().toISOString().slice(0,10);
  return `${safeName}_${date}.xlsx`;
}

function exportExcel() {
  if (!getItems().length) return alert('Список пуст');
  XLSX.writeFile(buildWorkbook(), getFileName());
}

/* ==================== ПОДЕЛИТЬСЯ ==================== */
async function shareExcel() {
  if (!getItems().length) return alert('Список пуст');

  try {
    // Готовим Excel-файл
    const wb = buildWorkbook();
    const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    const mime = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
    const blob = new Blob([wbout], { type: mime });
    const fileName = getFileName();
    const file = new File([blob], fileName, { type: mime });

    // Проверка наличия Web Share API
    if (typeof navigator.share !== 'function') {
      downloadBlob(blob, fileName);
      alert('Ваш браузер не поддерживает функцию "Поделиться".\nФайл сохранён в папку "Загрузки".');
      return;
    }

    // Попытка №1: поделиться файлом напрямую
    try {
      await navigator.share({
        files: [file],
        title: currentList().name
      });
      return; // Успех!
    } catch (err) {
      if (err.name === 'AbortError') return; // Пользователь сам закрыл меню
      console.error('Share с файлом не удался:', err.name, err.message);
    }

    // Попытка №2: поделиться текстом (без файла)
    try {
      const preview = getItems().slice(0, 5).map(i =>
        `• ${i.name}: ${i.width}×${i.length}×${i.thick} мм × ${i.qty || 1}`
      ).join('\n');
      await navigator.share({
        title: `Список ЛДСП: ${currentList().name}`,
        text: `Позиций: ${getItems().length}\n\n${preview}`
      });
      // Текст ушёл, теперь отдельно сохраняем файл
      downloadBlob(blob, fileName);
      return;
    } catch (err) {
      if (err.name === 'AbortError') return;
      console.error('Share с текстом не удался:', err.name, err.message);
    }

    // Ничего не сработало — скачиваем файл
    downloadBlob(blob, fileName);
    alert(
      'Системное меню "Поделиться" для Excel-файлов недоступно на этом устройстве.\n\n' +
      '📁 Файл сохранён в папку "Загрузки".\n\n' +
      'Откройте его через "Загрузки" или "Файлы" и нажмите "Поделиться" вручную.'
    );

  } catch (err) {
    alert('Ошибка: ' + err.message);
  }
}

function downloadBlob(blob, fileName) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

/* ==================== ИМПОРТ ==================== */
function findCol(keys, keywords, exacts = []) {
  for (const k of keys) {
    const low = k.toLowerCase().trim();
    if (keywords.some(kw => low.includes(kw))) return k;
  }
  for (const k of keys) {
    if (exacts.includes(k.toLowerCase().trim())) return k;
  }
  return null;
}

function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = new Uint8Array(ev.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
      if (!rows.length) throw new Error('Файл пуст');

      const keys = Object.keys(rows[0]);
      const kName = findCol(keys, ['наименован', 'name'], ['имя']);
      const kW    = findCol(keys, ['ширин', 'width'], ['ш']);
      const kL    = findCol(keys, ['длин', 'length'], ['д']);
      const kT    = findCol(keys, ['толщин', 'thick', 'толщ'], ['т']);
      const kQ    = findCol(keys, ['количеств', 'кол-во', 'кол', 'qty']);

      if (!kName || !kW || !kL || !kT)
        throw new Error('Не найдены нужные колонки.\nОжидаются: Наименование, Ширина, Длина, Толщина.');

      const toNum = v => parseFloat(String(v).replace(',', '.'));
      const items = [];
      for (const r of rows) {
        const name = String(r[kName] ?? '').trim();
        const w = toNum(r[kW]);
        const l = toNum(r[kL]);
        const t = toNum(r[kT]);
        const q = kQ ? Math.max(1, Math.floor(toNum(r[kQ]) || 1)) : 1;
        if (name && w > 0 && l > 0 && t > 0)
          items.push({ id: uid(), name, width: w, length: l, thick: t, qty: q });
      }
      if (!items.length) throw new Error('Не найдено ни одной корректной строки');
      askImport(items);
    } catch (err) {
      alert('Ошибка импорта: ' + err.message);
    }
    e.target.value = '';
  };
  reader.readAsArrayBuffer(file);
}

function askImport(items) {
  const cur = currentList();
  if (!cur.items.length) {
    setItems(items);
    saveState();
    render();
    return;
  }
  const replace = confirm(
    `Найдено ${items.length} строк в Excel.\n\n` +
    `Текущий список "${cur.name}" содержит ${cur.items.length} записей.\n\n` +
    `ОК — ЗАМЕНИТЬ текущий список\n` +
    `Отмена — ДОБАВИТЬ в конец`
  );
  setItems(replace ? items : cur.items.concat(items));
  saveState();
  render();
}

/* ==================== СТАРТ ==================== */
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
