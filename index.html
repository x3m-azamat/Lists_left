<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>Учёт ЛДСП</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #f5f5f5; color: #222;
    padding: 16px; padding-bottom: calc(20px + env(safe-area-inset-bottom));
    max-width: 1100px; margin: 0 auto;
  }

  /* ---- Логотип сверху по центру, на белом ---- */
  .logo-bar {
    background: #fff; border-radius: 12px;
    padding: 16px; margin: 0 0 14px;
    box-shadow: 0 2px 10px rgba(0,0,0,.07);
    display: flex; align-items: center; justify-content: center;
  }
  .logo-bar img {
    height: 56px; width: auto; max-width: 220px;
    object-fit: contain; display: block;
  }

  h1 { font-size: 22px; margin: 0 0 14px; }

  /* ---- Списки (верхняя панель) ---- */
  .list-bar {
    display: flex; gap: 8px; align-items: center;
    background: #fff; border-radius: 12px; padding: 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.07);
    margin-bottom: 14px; flex-wrap: wrap;
  }
  .list-bar select {
    flex: 1; min-width: 180px;
    padding: 12px 14px; font-size: 16px; font-weight: 500;
    border: 1.5px solid #d0d0d0; border-radius: 10px; background: #fafafa;
    color: #222;
  }
  .list-bar select:focus { outline: none; border-color: #4f46e5; }
  .icon-btn {
    width: 46px; height: 46px; padding: 0; font-size: 18px;
    background: #eef2ff; color: #4f46e5; border-radius: 10px;
    flex-shrink: 0; border: 0; cursor: pointer;
  }
  .icon-btn.danger { background: #fee2e2; color: #dc2626; }

  .card {
    background: #fff; border-radius: 14px; padding: 20px;
    box-shadow: 0 2px 10px rgba(0,0,0,.07); margin-bottom: 16px;
  }
  label { display: block; font-size: 15px; margin: 0 0 6px; color: #555; font-weight: 500; }
  input[type="text"], input[type="number"], input:not([type]) {
    width: 100%; padding: 14px 16px; font-size: 17px;
    border: 1.5px solid #d0d0d0; border-radius: 10px; background: #fafafa;
  }
  input:focus { outline: none; border-color: #4f46e5; background: #fff; }
  .form-grid {
    display: grid; grid-template-columns: 2fr 1fr 1fr 1fr;
    gap: 14px; align-items: end;
  }
  @media (max-width: 700px) {
    .form-grid { grid-template-columns: 1fr 1fr; }
    .form-grid .full { grid-column: 1 / -1; }
  }
  button {
    padding: 16px; font-size: 17px; border: 0; border-radius: 10px;
    background: #4f46e5; color: #fff; cursor: pointer; font-weight: 500;
    transition: transform .05s, filter .15s;
  }
  button:active { transform: scale(.98); filter: brightness(.92); }
  button.sec { background: #16a34a; }
  button.imp { background: #0ea5e9; }
  button.del { background: #dc2626; }
  .add-btn { margin-top: 18px; width: 100%; font-size: 18px; padding: 18px; }

  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 16px; }
  th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #eee; }
  th { background: #f0f0f0; font-weight: 600; font-size: 14px;
       text-transform: uppercase; letter-spacing: .03em; color: #555; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  th.num { text-align: right; }
  .x {
    background: #fee2e2; color: #dc2626; border: 0;
    width: 40px; height: 40px; border-radius: 8px;
    font-size: 20px; cursor: pointer; padding: 0;
  }
  .empty { color: #999; text-align: center; padding: 40px 20px; font-size: 16px; }
  .sum { font-size: 15px; color: #444; margin: 14px 0 0; padding: 12px;
         background: #f0f4ff; border-radius: 8px; }
  .sum b { color: #4f46e5; }
  .actions-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 16px; }
  @media (max-width: 600px) { .actions-3 { grid-template-columns: 1fr; } }

  /* ---- Автодополнение ---- */
  .ac-wrap { position: relative; }
  .ac-list {
    position: absolute; left: 0; right: 0; top: calc(100% + 4px);
    background: #fff; border: 1px solid #e0e0e0; border-radius: 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,.12);
    max-height: 280px; overflow-y: auto;
    z-index: 50; display: none; padding: 4px;
  }
  .ac-list.open { display: block; }
  .ac-item {
    padding: 14px; font-size: 16px; border-radius: 8px;
    cursor: pointer; display: flex; align-items: center; gap: 10px;
  }
  .ac-item:hover, .ac-item.active { background: #eef2ff; }
  .ac-item .ico { color: #4f46e5; font-size: 14px; flex-shrink: 0; }
  .ac-item mark { background: #fde68a; color: inherit; padding: 0 1px; border-radius: 2px; }

  @media (max-width: 500px) {
    .logo-bar img { height: 44px; }
    h1 { font-size: 18px; }
  }
</style>
</head>
<body>

<div class="logo-bar">
  <img src="parma.svg" alt="Parma">
</div>

<h1>📐 Учёт панелей ЛДСП</h1>

<div class="list-bar">
  <select id="listSelect" onchange="switchList(this.value)"></select>
  <button class="icon-btn" onclick="newList()" title="Новый список">➕</button>
  <button class="icon-btn" onclick="renameList()" title="Переименовать">✏️</button>
  <button class="icon-btn danger" onclick="deleteList()" title="Удалить список">🗑</button>
</div>

<div class="card">
  <div class="form-grid">
    <div class="full">
      <label>Наименование</label>
      <div class="ac-wrap">
        <input id="name" type="text" placeholder="Начните вводить — появятся подсказки" autocomplete="off">
        <div class="ac-list" id="acList"></div>
      </div>
    </div>
    <div>
      <label>Ширина, мм</label>
      <input id="width" type="number" inputmode="numeric" placeholder="600">
    </div>
    <div>
      <label>Длина, мм</label>
      <input id="length" type="number" inputmode="numeric" placeholder="1200">
    </div>
    <div>
      <label>Толщина, мм</label>
      <input id="thick" type="number" inputmode="numeric" placeholder="16">
    </div>
  </div>
  <button class="add-btn" onclick="addItem()">➕ Добавить панель</button>
</div>

<div class="card">
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Наименование</th>
          <th class="num">Ш, мм</th>
          <th class="num">Д, мм</th>
          <th class="num">Т, мм</th>
          <th class="num">Площадь, м²</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div id="empty" class="empty">Пока пусто. Добавьте первую панель.</div>
  <div class="sum" id="sum" style="display:none"></div>

  <div class="actions-3">
    <button class="sec" onclick="exportExcel()">📥 Скачать Excel</button>
    <button class="imp" onclick="document.getElementById('fileInput').click()">📂 Импорт Excel</button>
    <button class="del" onclick="clearAll()">🗑 Очистить список</button>
  </div>
  <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none" onchange="handleFile(event)">
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
/* ==================== ХРАНИЛИЩЕ ==================== */
const STORAGE_KEY = 'ldsp_lists_v1';
const OLD_KEY = 'ldsp_items_v1';
const $ = id => document.getElementById(id);

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && Array.isArray(s.lists) && s.lists.length) return s;
    }
  } catch (e) { console.error(e); }

  // Миграция из старого формата (одна таблица)
  let oldItems = [];
  try { oldItems = JSON.parse(localStorage.getItem(OLD_KEY) || '[]'); } catch {}
  const list = { id: uid(), name: 'Список 1', items: Array.isArray(oldItems) ? oldItems : [] };
  const s = { lists: [list], currentListId: list.id };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
  return s;
}

let state = loadState();

function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function currentList() { return state.lists.find(l => l.id === state.currentListId) || state.lists[0]; }
function getItems() { return currentList().items; }
function setItems(items) { currentList().items = items; saveState(); }

/* ==================== УПРАВЛЕНИЕ СПИСКАМИ ==================== */
function renderListSelect() {
  const sel = $('listSelect');
  sel.innerHTML = '';
  state.lists.forEach(l => {
    const opt = document.createElement('option');
    opt.value = l.id;
    opt.textContent = `${l.name} (${l.items.length})`;
    if (l.id === state.currentListId) opt.selected = true;
    sel.appendChild(opt);
  });
}

function switchList(id) {
  state.currentListId = id;
  saveState();
  closeAc();
  render();
}

function newList() {
  const name = prompt('Название нового списка:', `Список ${state.lists.length + 1}`);
  if (name === null) return;
  const trimmed = name.trim() || `Список ${state.lists.length + 1}`;
  const list = { id: uid(), name: trimmed, items: [] };
  state.lists.push(list);
  state.currentListId = list.id;
  saveState();
  closeAc();
  renderListSelect();
  render();
}

function renameList() {
  const l = currentList();
  const name = prompt('Новое название:', l.name);
  if (name === null) return;
  const trimmed = name.trim();
  if (!trimmed) return;
  l.name = trimmed;
  saveState();
  renderListSelect();
}

function deleteList() {
  if (state.lists.length <= 1) {
    alert('Нельзя удалить единственный список');
    return;
  }
  const l = currentList();
  if (!confirm(`Удалить список "${l.name}" (${l.items.length} записей)?`)) return;
  state.lists = state.lists.filter(x => x.id !== l.id);
  state.currentListId = state.lists[0].id;
  saveState();
  renderListSelect();
  render();
}

/* ==================== АВТОДОПОЛНЕНИЕ ==================== */
const nameInput = $('name');
const acList = $('acList');
let acMatches = [];
let acActive = -1;

function uniqueNames() {
  const set = new Set(getItems().map(i => i.name.trim()));
  return [...set].filter(Boolean).sort((a, b) => a.localeCompare(b, 'ru'));
}

function highlight(text, query) {
  if (!query) return escapeHtml(text);
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1) return escapeHtml(text);
  return escapeHtml(text.slice(0, idx))
       + '<mark>' + escapeHtml(text.slice(idx, idx + query.length)) + '</mark>'
       + escapeHtml(text.slice(idx + query.length));
}

function openAc(query) {
  const all = uniqueNames();
  const q = query.trim().toLowerCase();
  acMatches = (q ? all.filter(n => n.toLowerCase().includes(q)) : all).slice(0, 8);

  if (!acMatches.length) { acList.classList.remove('open'); return; }
  acActive = -1;
  acList.innerHTML = acMatches.map((n, i) =>
    `<div class="ac-item" data-idx="${i}"><span class="ico">▸</span><span>${highlight(n, q)}</span></div>`
  ).join('');
  acList.classList.add('open');

  acList.querySelectorAll('.ac-item').forEach(el => {
    el.addEventListener('mousedown', e => {
      e.preventDefault();
      pickAc(parseInt(el.dataset.idx, 10));
    });
    el.addEventListener('touchstart', e => {
      e.preventDefault();
      pickAc(parseInt(el.dataset.idx, 10));
    }, { passive: false });
  });
}

function closeAc() { acList.classList.remove('open'); acActive = -1; acMatches = []; }

function pickAc(idx) {
  if (idx < 0 || idx >= acMatches.length) return;
  nameInput.value = acMatches[idx];
  closeAc();
  nameInput.focus();
}

nameInput.addEventListener('input', () => openAc(nameInput.value));
nameInput.addEventListener('focus', () => openAc(nameInput.value));
nameInput.addEventListener('blur', () => setTimeout(closeAc, 150));
nameInput.addEventListener('keydown', e => {
  if (!acList.classList.contains('open')) return;
  const els = acList.querySelectorAll('.ac-item');
  if (e.key === 'ArrowDown') { e.preventDefault(); acActive = (acActive + 1) % els.length; updateActive(els); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); acActive = (acActive - 1 + els.length) % els.length; updateActive(els); }
  else if (e.key === 'Enter' && acActive >= 0) { e.preventDefault(); pickAc(acActive); }
  else if (e.key === 'Escape') closeAc();
});

function updateActive(els) {
  els.forEach((el, i) => el.classList.toggle('active', i === acActive));
  if (acActive >= 0 && els[acActive]) els[acActive].scrollIntoView({ block: 'nearest' });
}

/* ==================== ОСНОВНЫЕ ОПЕРАЦИИ ==================== */
function addItem() {
  const name  = $('name').value.trim();
  const width = parseFloat($('width').value);
  const len   = parseFloat($('length').value);
  const thick = parseFloat($('thick').value);

  if (!name) return alert('Введите наименование');
  if (!(width > 0) || !(len > 0) || !(thick > 0))
    return alert('Ширина, длина и толщина должны быть положительными');

  const items = getItems();
  items.push({ id: uid(), name, width, length: len, thick });
  setItems(items);
  render();
  renderListSelect();

  $('name').value = ''; $('width').value = '';
  $('length').value = ''; $('thick').value = '';
  closeAc();
  $('name').focus();
}

function removeItem(id) {
  if (!confirm('Удалить запись?')) return;
  setItems(getItems().filter(i => i.id !== id));
  render();
  renderListSelect();
}

function clearAll() {
  if (!getItems().length) return;
  if (!confirm(`Удалить все записи из списка "${currentList().name}"?`)) return;
  setItems([]);
  render();
  renderListSelect();
}

function render() {
  const items = getItems();
  const tbody = $('tbody');
  tbody.innerHTML = '';
  $('empty').style.display = items.length ? 'none' : 'block';
  const sumBox = $('sum');
  sumBox.style.display = items.length ? 'block' : 'none';

  let totalM2 = 0;
  items.forEach(i => {
    const m2 = (i.width / 1000) * (i.length / 1000);
    totalM2 += m2;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${escapeHtml(i.name)}</td>
      <td class="num">${i.width}</td>
      <td class="num">${i.length}</td>
      <td class="num">${i.thick}</td>
      <td class="num">${m2.toFixed(3)}</td>
      <td><button class="x" onclick="removeItem('${i.id}')" aria-label="Удалить">✕</button></td>`;
    tbody.appendChild(tr);
  });
  sumBox.innerHTML = `Панелей: <b>${items.length}</b> · Общая площадь: <b>${totalM2.toFixed(3)} м²</b>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

/* ==================== ЭКСПОРТ ==================== */
function exportExcel() {
  const items = getItems();
  if (!items.length) return alert('Список пуст');
  const rows = items.map((i, n) => ({
    '№': n + 1,
    'Наименование': i.name,
    'Ширина, мм': i.width,
    'Длина, мм': i.length,
    'Толщина, мм': i.thick,
    'Площадь, м²': +((i.width / 1000) * (i.length / 1000)).toFixed(3)
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:5},{wch:28},{wch:12},{wch:12},{wch:12},{wch:12}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'ЛДСП');
  const safeName = currentList().name.replace(/[\\/:*?"<>|]/g, '_').trim() || 'ЛДСП';
  const date = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `${safeName}_${date}.xlsx`);
}

/* ==================== ИМПОРТ ==================== */
function findCol(keys, keywords, exacts = []) {
  for (const k of keys) {
    const low = k.toLowerCase().trim();
    if (keywords.some(kw => low.includes(kw))) return k;
  }
  for (const k of keys) {
    if (exacts.includes(k.toLowerCase().trim())) return k;
  }
  return null;
}

function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = new Uint8Array(ev.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
      if (!rows.length) throw new Error('Файл пуст');

      const keys = Object.keys(rows[0]);
      const kName = findCol(keys, ['наименован', 'name'], ['имя']);
      const kW    = findCol(keys, ['ширин', 'width'], ['ш']);
      const kL    = findCol(keys, ['длин', 'length'], ['д']);
      const kT    = findCol(keys, ['толщин', 'thick', 'толщ'], ['т']);

      if (!kName || !kW || !kL || !kT)
        throw new Error('Не найдены нужные колонки.\nОжидаются: Наименование, Ширина, Длина, Толщина.');

      const toNum = v => parseFloat(String(v).replace(',', '.'));
      const items = [];
      for (const r of rows) {
        const name = String(r[kName] ?? '').trim();
        const w = toNum(r[kW]);
        const l = toNum(r[kL]);
        const t = toNum(r[kT]);
        if (name && w > 0 && l > 0 && t > 0)
          items.push({ id: uid(), name, width: w, length: l, thick: t });
      }
      if (!items.length) throw new Error('Не найдено ни одной корректной строки');

      askImport(items);
    } catch (err) {
      alert('Ошибка импорта: ' + err.message);
    }
    e.target.value = '';
  };
  reader.readAsArrayBuffer(file);
}

function askImport(items) {
  const cur = currentList();
  if (!cur.items.length) {
    setItems(items);
    saveState();
    render();
    renderListSelect();
    return;
  }
  const replace = confirm(
    `Найдено ${items.length} строк в Excel.\n\n` +
    `Текущий список "${cur.name}" содержит ${cur.items.length} записей.\n\n` +
    `ОК — ЗАМЕНИТЬ текущий список\n` +
    `Отмена — ДОБАВИТЬ в конец`
  );
  setItems(replace ? items : cur.items.concat(items));
  saveState();
  render();
  renderListSelect();
}

/* ==================== СТАРТ ==================== */
renderListSelect();
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
